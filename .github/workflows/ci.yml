name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A new push makes the old run pointless; cancel it instead of paying for it twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gyansankalp_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gyansankalp_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci-only-not-a-secret@localhost:55432/gyansankalp_ci
      JWT_SECRET: ci-only-jwt-secret-value-not-used-anywhere-32
      ADMIN_JWT_SECRET: ci-only-admin-jwt-secret-not-used-anywhere-thirty-two
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-only-not-a-secret
      S3_ENDPOINT_URL: http://localhost:9999
      S3_CREATE_BUCKET: "false"
      EXPOSE_DOCS: "false"
      LOG_JSON: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax and undefined-name gate
        run: |
          python -m compileall -q app alembic scripts
          pip install "ruff<1.0"
          # Ruff's core set: syntax errors, unused imports, undefined names.
          # Style rules are left out so the gate stays about breakage.
          ruff check --select E4,E7,E9,F app alembic scripts

      - name: Migrations apply to a clean database
        run: alembic upgrade head

      - name: Models and migrations have not drifted apart
        run: alembic check

      - name: Tests
        run: python -m pytest -q

      # The guard is what stops a half-configured server from serving students.
      # CI proves it fails, not just that it exists.
      - name: Production refuses a weak configuration
        run: |
          set -e
          export APP_ENV=production
          export CORS_ORIGINS=https://gyansankalp.example
          export DATABASE_URL="postgresql+psycopg://ci:ci-only-not-a-secret@localhost:55432/gyansankalp_ci?sslmode=require"
          export JWT_SECRET=short
          export ADMIN_JWT_SECRET=also-short-admin-secret
          if python -c "from app.core.config import Settings; Settings()" 2>/dev/null; then
            echo "production guard did not fire on short secrets" >&2
            exit 1
          fi
          # Long enough and otherwise valid: the only problem left is one key for
          # both auth systems, which is not separation.
          export JWT_SECRET=ci-only-production-shaped-secret-value-thirty-two-chars-long
          export ADMIN_JWT_SECRET=$JWT_SECRET
          export SMTP_HOST=smtp.example
          export MAIL_FROM=no-reply@gyansankalp.example
          export VERIFY_LINK_BASE=https://gyansankalp.example/verify-email
          if python -c "from app.core.config import Settings; Settings()" 2>/tmp/guard.log; then
            echo "production accepted an admin key identical to the student key" >&2
            exit 1
          fi
          grep -q "must differ from JWT_SECRET" /tmp/guard.log || {
            echo "the failure was not about the shared key: $(cat /tmp/guard.log)" >&2
            exit 1
          }
          echo "production guard rejected short secrets and a shared admin key"

  # The frontend may not be pushed yet, so the job decides for itself instead of
  # failing a backend-only run on a missing package.json.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is the frontend in this repository?
        id: check
        shell: bash
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: npm ci

      - name: Lint
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: npm run lint

      - name: Build
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: npm run build

  # Nothing is published from CI yet; this job is the gate that says a build is
  # safe to ship, and it fails loudly on the checks that matter before deploy.
  # !cancelled() keeps it running when the frontend job is skipped.
  release-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
        && needs.backend.result == 'success' && needs.frontend.result != 'failure'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      APP_ENV: production
      # Valid production-shaped values: the point is that the app accepts a
      # correct configuration, not that CI holds the real secrets.
      DATABASE_URL: postgresql+psycopg://ci:ci-only-not-a-secret@localhost:55432/gyansankalp_ci?sslmode=require
      JWT_SECRET: ci-only-production-shaped-secret-value-thirty-two-chars-long
      ADMIN_JWT_SECRET: ci-only-production-shaped-admin-secret-value-forty-eight-chars
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-only-not-a-secret
      S3_ENDPOINT_URL: https://s3.ap-southeast-1.amazonaws.com
      CORS_ORIGINS: https://gyansankalp.example
      EXPOSE_DOCS: "false"
      # Verification email is part of the student flow, so a production-shaped
      # configuration has to carry mail settings too.
      SMTP_HOST: smtp.example
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci-only-not-a-secret
      # Staff have no password any more, so production refuses to boot without
      # the Google client id. CI carries a production-shaped one.
      GOOGLE_CLIENT_ID: ci-only-google-client.apps.googleusercontent.com
      MAIL_FROM: no-reply@gyansankalp.example
      VERIFY_LINK_BASE: https://gyansankalp.example/verify-email
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: The app boots under a real production configuration
        run: python -c "import app.main; print('production configuration accepted')"

      - name: The public surface is what production intends
        run: |
          python - <<'PY'
          from app.core.config import settings
          from app.main import app

          if app.docs_url or app.openapi_url:
              raise SystemExit("API documentation is reachable in production")

          paths = set(app.openapi()["paths"])
          for probe in ("/health", "/ready"):
              if probe not in paths:
                  raise SystemExit(f"deployment probe missing: {probe}")
          print(f"{len(paths)} routes published, docs closed, probes present")
          PY
