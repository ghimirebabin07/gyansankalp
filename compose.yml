services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: bobby 
      POSTGRES_DB: gyansankalp
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    # minio/minio is no longer on Docker Hub; alpine/minio is the same server
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    user: "0:0"  # the image runs as uid 1000, which cannot write the fresh volume
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_pw
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:  
  pgdata:
  miniodata:
