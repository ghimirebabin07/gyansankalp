services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: bobby  # local development only - never reuse this anywhere real
      POSTGRES_DB: gyansankalp
    # Loopback-only: nothing on the LAN or the internet can reach these ports.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    # minio/minio is no longer on Docker Hub; alpine/minio is the same server
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    user: "0:0"  # the image runs as uid 1000, which cannot write the fresh volume
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_pw  # local development only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
volumes:  
  pgdata:
  miniodata:
