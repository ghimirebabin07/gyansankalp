services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      # Read from a gitignored .env beside this file so no credential ever
      # reaches the repository. Compose fails loudly when it is missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create a .env with POSTGRES_PASSWORD first}
      POSTGRES_DB: gyansankalp
    # Loopback-only: nothing on the LAN or the internet can reach these ports.
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    # minio/minio is no longer on Docker Hub; alpine/minio is the same server
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    user: "0:0"  # the image runs as uid 1000, which cannot write the fresh volume
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?create a .env with MINIO_ROOT_PASSWORD first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
volumes:  
  pgdata:
  miniodata:
